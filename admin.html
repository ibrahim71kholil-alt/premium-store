<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PREMIUM STORE — Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Login Page -->
  <section id="loginPage" class="login-page">
    <div class="login-card">
      <div class="logo-mark">◆</div>
      <h1>PREMIUM STORE</h1>
      <p class="admin-label">ADMIN PANEL</p>
      <form id="loginForm">
        <div class="input-group">
          <label>Admin Email</label>
          <input type="email" id="email" placeholder="Enter admin email" required>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="main-button" id="loginButton">LOGIN</button>
        <p id="loginMessage" class="message"></p>
      </form>
    </div>
  </section>

  <!-- Dashboard Page -->
  <section id="dashboardPage" class="dashboard-page hidden">
    <header class="admin-header">
      <div class="brand">
        <div class="small-logo">◆</div>
        <div><h2>PREMIUM STORE</h2><span>ADMIN PANEL</span></div>
      </div>
      <button id="logoutButton" class="logout-button">Logout</button>
    </header>

    <main class="admin-container">
      <section class="stats-grid">
        <div class="stat-card"><span>Total Apps</span><strong id="totalApps">0</strong></div>
        <div class="stat-card"><span>Featured Apps</span><strong id="featuredApps">0</strong></div>
        <div class="stat-card"><span>Latest Apps</span><strong id="latestApps">0</strong></div>
      </section>

      <section class="admin-card">
        <div class="section-heading">
          <h2>Add / Edit App</h2>
          <p>Fill in the details to add an app to the Premium Store.</p>
        </div>
        <form id="appForm">
          <input type="hidden" id="editId">
          <div class="form-group"><label>App Name *</label><input type="text" id="appName" required></div>
          <div class="form-group">
            <label>Category *</label>
            <select id="category" required>
              <option value="">Select Category</option>
              <option value="AI">AI</option>
              <option value="Education">Education</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Social">Social</option>
              <option value="Tools">Tools</option>
              <option value="Security">Security</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group"><label>Description *</label><textarea id="description" rows="4" required></textarea></div>
          <div class="two-column">
            <div class="form-group"><label>Version</label><input type="text" id="version"></div>
            <div class="form-group"><label>App Size</label><input type="text" id="size"></div>
          </div>
          <div class="form-group"><label>App Logo URL</label><input type="url" id="iconUrl" placeholder="https://..."></div>
          
          <!-- Download Links -->
          <div class="form-group"><label>Telegram Link</label><input type="url" id="telegramUrl" placeholder="https://t.me/..."></div>
          <div class="form-group"><label>WhatsApp Link</label><input type="url" id="whatsappUrl" placeholder="https://whatsapp.com/channel/..."></div>
          <div class="form-group"><label>Direct Download Link (Optional)</label><input type="url" id="apkUrl" placeholder="https://..."></div>

          <div class="checkbox-area">
            <label class="check-item"><input type="checkbox" id="featured"><span>Featured App</span></label>
            <label class="check-item"><input type="checkbox" id="latest"><span>Latest App</span></label>
          </div>
          <div class="form-buttons">
            <button type="submit" class="main-button" id="saveButton">SAVE APP</button>
            <button type="button" class="cancel-button hidden" id="cancelButton">CANCEL</button>
          </div>
          <p id="formMessage" class="message"></p>
        </form>
      </section>

      <section class="admin-card">
        <div class="list-heading"><h2>Your Apps</h2><button id="refreshButton" class="refresh-button">Refresh</button></div>
        <div id="appsList"><div class="loading">Loading apps...</div></div>
      </section>
    </main>
  </section>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="admin.js"></script>
</body>
</html>
