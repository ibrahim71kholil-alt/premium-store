<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Premium Store - Admin Panel</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage" class="login-page">

    <div class="login-box">

        <div class="login-logo">
            PREMIUM STORE
        </div>

        <h2>Admin Panel</h2>

        <p>Login to manage your apps</p>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Admin Email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="loginMessage"></div>

    </div>

</div>


<!-- ================= DASHBOARD ================= -->

<div id="dashboardPage" class="dashboard-page" style="display:none;">

    <!-- HEADER -->

    <header class="admin-header">

        <div class="admin-logo">
            PREMIUM STORE
        </div>

        <button id="logoutBtn">
            Logout
        </button>

    </header>


    <!-- MAIN -->

    <main class="admin-container">

        <h1>Dashboard</h1>


        <!-- STATS -->

        <section class="stats-grid">

            <div class="stat-card">
                <span>Total Apps</span>
                <strong id="totalApps">0</strong>
            </div>

            <div class="stat-card">
                <span>Featured Apps</span>
                <strong id="featuredApps">0</strong>
            </div>

            <div class="stat-card">
                <span>Latest Apps</span>
                <strong id="latestApps">0</strong>
            </div>

        </section>


        <!-- ================= APP FORM ================= -->

        <section class="admin-card">

            <div class="section-header">

                <h2 id="formTitle">
                    Add New App
                </h2>

            </div>


            <form id="appForm">

                <input
                    type="hidden"
                    id="editingAppId"
                >


                <div class="form-group">

                    <label>App Name</label>

                    <input
                        type="text"
                        id="appName"
                        placeholder="Example: AI Assistant"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Category</label>

                    <select id="appCategory" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="AI">
                            AI
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Tools">
                            Tools
                        </option>

                        <option value="Video">
                            Video
                        </option>

                        <option value="Photo">
                            Photo
                        </option>

                        <option value="Security">
                            Security
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Description</label>

                    <textarea
                        id="appDescription"
                        placeholder="Write app description"
                        required
                    ></textarea>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>Version</label>

                        <input
                            type="text"
                            id="appVersion"
                            placeholder="1.0.0"
                        >

                    </div>


                    <div class="form-group">

                        <label>App Size</label>

                        <input
                            type="text"
                            id="appSize"
                            placeholder="25 MB"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>Android Version</label>

                    <input
                        type="text"
                        id="androidVersion"
                        placeholder="Android 8.0+"
                    >

                </div>


                <div class="form-group">

                    <label>Download Count</label>

                    <input
                        type="number"
                        id="downloadCount"
                        value="0"
                        min="0"
                    >

                </div>


                <div class="form-group">

                    <label>App Logo URL</label>

                    <input
                        type="url"
                        id="iconUrl"
                        placeholder="https://..."
                    >

                </div>


                <!-- ================= APK UPLOAD ================= -->

                <div class="apk-upload-box">

                    <label>
                        APK File
                    </label>

                    <input
                        type="file"
                        id="apkFile"
                        accept=".apk,application/vnd.android.package-archive"
                    >

                    <div id="selectedApk">
                        No APK selected
                    </div>

                    <div id="uploadProgress"></div>

                </div>


                <!-- Existing APK URL -->

                <div class="form-group">

                    <label>
                        APK Download URL
                        <small>
                            (Automatically generated after upload)
                        </small>
                    </label>

                    <input
                        type="url"
                        id="apkUrl"
                        placeholder="APK URL will appear here"
                    >

                </div>


                <!-- SCREENSHOTS -->

                <div class="form-group">

                    <label>
                        Screenshot URLs
                    </label>

                    <textarea
                        id="screenshots"
                        placeholder="One URL per line"
                    ></textarea>

                </div>


                <!-- OPTIONS -->

                <div class="checkbox-row">

                    <label>

                        <input
                            type="checkbox"
                            id="featured"
                        >

                        Featured

                    </label>


                    <label>

                        <input
                            type="checkbox"
                            id="latest"
                        >

                        Latest

                    </label>

                </div>


                <!-- BUTTONS -->

                <div class="form-buttons">

                    <button
                        type="submit"
                        id="publishBtn"
                    >
                        Publish App
                    </button>

                    <button
                        type="button"
                        id="cancelEditBtn"
                        style="display:none;"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- ================= APP LIST ================= -->

        <section class="admin-card">

            <div class="section-header">

                <h2>
                    Apps
                </h2>

                <button id="refreshBtn">
                    Refresh
                </button>

            </div>

            <div id="appsList"></div>

        </section>

    </main>

</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>


<!-- Appwrite -->

<script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>


<!-- Admin JS -->

<script src="admin.js"></script>

</body>
</html>
