<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Store - Best Apps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <span class="logo-icon">◆</span>
      <h1>PREMIUM STORE</h1>
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search apps...">
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="hero">
    <h2>Welcome to Premium Store</h2>
    <p>Download the latest and best premium applications for free.</p>
  </header>

  <!-- Main Content -->
  <main class="container">
    
    <div class="section-title">
      <h3>Explore Apps</h3>
    </div>

    <!-- Category Filters -->
    <div class="category-filters" id="categoryFilters">
      <button class="filter-btn active" data-category="All">All</button>
      <button class="filter-btn" data-category="AI">AI</button>
      <button class="filter-btn" data-category="Tools">Tools</button>
      <button class="filter-btn" data-category="Entertainment">Entertainment</button>
      <button class="filter-btn" data-category="Social">Social</button>
      <button class="filter-btn" data-category="Security">Security</button>
      <button class="filter-btn" data-category="Other">Other</button>
    </div>

    <!-- Apps Grid -->
    <div class="apps-grid" id="appsGrid">
      <!-- JS দিয়ে এখানে স্কেলিটন বা অ্যাপ লোড হবে -->
    </div>

  </main>

  <footer>
    <p>&copy; 2026 Premium Store. All rights reserved.</p>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="https://pl31374249.profitableratecpmnetwork.com/1d/30/8d/1d308d008f39b503bd14acce9df36328.js"></script>
  <!-- App JS -->
  <script src="app.js"></script>
</body>
</html>
