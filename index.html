<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Store - Download Best Apps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <span class="logo-icon">◆</span>
      <h1>PREMIUM STORE</h1>
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search apps...">
    </div>
  </nav>

  <!-- Header / Hero Section -->
  <header class="hero">
    <h2>Welcome to Premium Store</h2>
    <p>Download the latest and best premium applications for free.</p>
  </header>

  <!-- Main Content -->
  <main class="container">
    
    <div class="section-title">
      <h3>Latest Apps</h3>
    </div>

    <!-- Apps Grid -->
    <div class="apps-grid" id="appsGrid">
      <div class="loading">Loading apps...</div>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Premium Store. All rights reserved.</p>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

  <!-- App JS -->
  <script src="app.js"></script>
</body>
</html>
