<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Details - Premium Store</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 0; }
    .main-header { background: #374F4E; padding: 20px; color: white; text-align: center; }
    .details-container { max-width: 800px; margin: 40px auto; padding: 25px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .details-header { display: flex; gap: 20px; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 20px; }
    .details-icon { width: 100px; height: 100px; border-radius: 20px; object-fit: cover; background: #f4f7f6; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; color: #374F4E; }
    .details-icon img { width: 100%; height: 100%; border-radius: 20px; }
    .details-title h1 { margin: 0 0 5px 0; font-size: 26px; color: #1a1a1a; }
    .details-title p { margin: 0; color: #707782; font-size: 15px; }
    .details-body h3 { margin-bottom: 15px; color: #374F4E; font-size: 20px; }
    .details-body p { color: #4a5568; line-height: 1.7; white-space: pre-wrap; font-size: 15px;}
    .meta-info { display: flex; gap: 20px; margin: 20px 0; padding: 15px 20px; background: #f8fafc; border-radius: 10px; border: 1px solid #e2e8f0; }
    .meta-item { display: flex; flex-direction: column; }
    .meta-item span { font-size: 13px; color: #707782; margin-bottom: 4px;}
    .meta-item strong { color: #1a1a1a; font-size: 16px; }
    .back-btn { display: inline-flex; align-items: center; margin-bottom: 20px; color: #374F4E; text-decoration: none; font-weight: 600; font-size: 16px; padding: 8px 15px; background: #fff; border: 1px solid #374F4E; border-radius: 8px;}
    .download-section { margin-top: 30px; border-top: 1px solid #eee; padding-top: 25px; display: flex; flex-direction: column; gap: 10px; }
    .btn-telegram { background: #0088cc; color: #fff; padding: 15px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; text-align: center; }
    .btn-whatsapp { background: #25D366; color: #fff; padding: 15px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; text-align: center; }
    .download-btn { background: #374F4E; color: #fff; padding: 15px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; text-align: center; }
  /* ==========================================
   PREMIUM STORE - ANIMATIONS
   ========================================== */

/* 1. App Card Entry (নিচ থেকে ভেসে ওঠা) */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.app-card {
  animation: fadeUp 0.6s ease-out forwards;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* 2. App Card Hover Effect (কার্ড হালকা ভেসে থাকা) */
.app-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
}

/* 3. Button Animations (বাটনের স্মুথ ইফেক্ট) */
.btn-telegram, .btn-whatsapp, .download-btn, .back-btn {
  transition: all 0.3s ease;
}

.btn-telegram:hover, .btn-whatsapp:hover, .download-btn:hover {
  transform: translateY(-3px) scale(1.02);
  filter: brightness(1.1);
  box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
}

/* Back Button Hover */
.back-btn:hover {
  transform: translateX(-5px);
  background: #e2e8f0;
}

/* 4. Details Page Container Animation (স্মুথ এন্ট্রি) */
@keyframes popIn {
  from { opacity: 0; transform: scale(0.95) translateY(15px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.details-container {
  animation: popIn 0.5s ease-out forwards;
}

/* 5. Skeleton Loading Animation (চকচকে লোডিং ইফেক্ট) */
@keyframes shimmer {
  0% { background-position: -200px 0; }
  100% { background-position: calc(200px + 100%) 0; }
}

.skeleton {
  background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite linear;
}

  </style>
  
</head>
<body>
  <header class="main-header">
    <div class="logo">◆ PREMIUM STORE</div>
  </header>

  <main style="padding: 20px; max-width: 800px; margin: 0 auto;">
    <a href="index.html" class="back-btn">← Back to Home</a>
    
    <div id="appDetails" class="details-container">
      <div style="text-align:center; padding: 40px; color: #707782;">Loading app details...</div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <!-- নিচে আমরা details.js ফাইলটিকে কল করছি -->
  <script src="details.js"></script>
</body>
</html>
